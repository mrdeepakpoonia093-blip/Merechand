<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Valentine Surprise ❤️</title>

<style>
body{
  margin:0;
  font-family:'Segoe UI',Arial,sans-serif;
  text-align:center;
  overflow:hidden;
  background:linear-gradient(45deg,#ff4e88,#ff8fab,#ffc2d1);
  color:white;
}

.topBanner{
  position:fixed;
  top:0;
  width:100%;
  background:rgba(255,255,255,0.2);
  backdrop-filter:blur(8px);
  padding:10px;
  font-size:22px;
  font-weight:bold;
}

.card{ margin-top:20vh; padding:20px; }

button{
  padding:15px 25px;
  font-size:20px;
  border:none;
  border-radius:10px;
  margin:10px;
  cursor:pointer;
}
#yes{background:#00ff9d;font-weight:bold;}
#no{background:#ff3c3c;color:white;}

.floatPhoto{
  position:fixed;
  width:90px;
  border-radius:12px;
  top:-100px;
  animation:fallPhoto 8s linear forwards;
  z-index:-1;
}
@keyframes fallPhoto{
  to{ transform:translateY(120vh) rotate(360deg); }
}

.confetti{
  position:fixed;
  top:-20px;
  font-size:22px;
  animation:fall 3s linear forwards;
}
@keyframes fall{
  to{ transform:translateY(110vh) rotate(360deg); opacity:0; }
}

#poemBox{
  max-width:320px;
  margin:20px auto;
  font-size:22px;
  line-height:1.8;
  font-weight:bold;
  white-space:pre-line;
}

#loveGifBox img{
  width:160px;
  border-radius:20px;
  box-shadow:0 10px 25px rgba(0,0,0,0.25);
}

/* LETTER BUTTON */
.letterBtn{
  display:inline-block;
  margin-top:20px;
  padding:14px 22px;
  background:white;
  color:#ff4e88;
  font-weight:bold;
  border-radius:12px;
  text-decoration:none;
  box-shadow:0 5px 15px rgba(0,0,0,0.2);
}

/* GIFTS */
.gifts{
  position:fixed;
  bottom:30px;
  width:100%;
  display:flex;
  justify-content:center;
  gap:15px;
}
.gift{
  font-size:40px;
  background:white;
  color:black;
  border-radius:15px;
  padding:10px;
  width:100px;
  height:100px;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  box-shadow:0 5px 15px rgba(0,0,0,0.2);
}
.gift p{ font-size:11px;font-weight:bold;margin:0;text-align:center; }
</style>
</head>

<body>

<div class="topBanner">Together For 47 Days… Forever ❤️</div>

<div class="card">
  <h1>Will You Be My Valentine? ❤️</h1>
  <button id="yes">YES</button>
  <button id="no">NO</button>

  <div id="message"></div>
  <div id="loveGifBox"></div>
  <div id="poemBox"></div>
  <div id="letterBox"></div>
</div>

<div id="gallery"></div>

<script>
const yesBtn=document.getElementById("yes");
const noBtn=document.getElementById("no");
const poemBox=document.getElementById("poemBox");
const loveGifBox=document.getElementById("loveGifBox");
const letterBox=document.getElementById("letterBox");
const gallery=document.getElementById("gallery");

let accepted=false;

const noMessages=[
"No","Are you sure mere Chand? 🥺","Really sure baby?",
"mera dil mat todo 💔","Please maan jao","Ab toh YES bol do 🥰"
];
let noIndex=0;

function moveNo(){
 if(accepted) return;
 noBtn.style.position="absolute";
 noBtn.style.left=Math.random()*80+"vw";
 noBtn.style.top=Math.random()*80+"vh";
 noIndex=(noIndex+1)%noMessages.length;
 noBtn.innerText=noMessages[noIndex];
}
noBtn.addEventListener("mouseover",moveNo);

const photos=[
"P1.jpeg","P2.jpeg","P3.jpeg","P4.jpeg","P5.jpeg","P6.jpeg","P7.jpeg",
"P8.jpeg","P9.jpeg","P10.jpeg","P11.jpeg","P12.jpeg","P13.jpeg","P14.jpeg"
];

setInterval(()=>{
 const img=document.createElement("img");
 img.src=photos[Math.floor(Math.random()*photos.length)];
 img.className="floatPhoto";
 img.style.left=Math.random()*100+"vw";
 gallery.appendChild(img);
 setTimeout(()=>img.remove(),8000);
},2500);

const poem=`Tum mere chand the,
tum mere chand ho,
aur tum mere chand hi rahoge. 🌙`;

function typeWriter(){
 let i=0;
 function typing(){
   if(i<poem.length){
     poemBox.innerHTML+=poem.charAt(i);
     i++;
     setTimeout(typing,100);
   }
 }
 typing();
}

/* SHOW GIFTS */
function showGifts(){
 const giftBox=document.createElement("div");
 giftBox.className="gifts";
 giftBox.innerHTML=`
  <div class="gift" onclick="openGift(this,'Meri har khushi, sirf tumse ❤️')">🎁</div>
  <div class="gift" onclick="openGift(this,'Tum ho toh sab kuch hai 💕')">🎁</div>
  <div class="gift" onclick="openGift(this,'Hamesha mere rehna 😘')">🎁</div>
 `;
 document.body.appendChild(giftBox);
}
function openGift(el,text){
 el.style.background="#fff0f3";
 el.innerHTML="<p>"+text+"</p>";
}

yesBtn.onclick=()=>{
 accepted=true;
 noBtn.style.display="none";

 new Audio("Do You Know.mp3").play();

 for(let i=0;i<80;i++){
  const c=document.createElement("div");
  c.innerHTML="💖";
  c.className="confetti";
  c.style.left=Math.random()*100+"vw";
  document.body.appendChild(c);
 }

 loveGifBox.innerHTML='<img src="Kisses Love GIF.gif">';
 typeWriter();
 showGifts();

 letterBox.innerHTML=`<a href="letter.docx" class="letterBtn" target="_blank">Read My Letter 💌</a>`;
};
</script>

</body>
</html>
